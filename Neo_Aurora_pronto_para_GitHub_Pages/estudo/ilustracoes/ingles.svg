    <radialGradient id="p" cx=".28" cy=".24" r=".83"><stop stop-color="#CAE4FF"/><stop offset=".45" stop-color="#558ECF"/><stop offset="1" stop-color="#25305A"/></radialGradient>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#BDB6D4" opacity=".3"/></pattern>
  </defs>
