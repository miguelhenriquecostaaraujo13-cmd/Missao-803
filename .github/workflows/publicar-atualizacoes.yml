name: Publicar atualizações importantes no mural

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publicar-aviso:
    # Apenas alterações marcadas como importantes, nunca toda alteração pequena.
    if: contains(github.event.head_commit.message, '[importante]')
    runs-on: ubuntu-latest
    steps:
      - name: Registrar novidade no mural do Portal 8º Ano
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const message = context.payload.head_commit?.message || "";
            const firstLine = message.split(/\r?\n/)[0] || "";
            const title = firstLine.replace(/\[importante\]/ig, "").trim().slice(0, 105);
            const description = message.split(/\r?\n/).slice(1).join(" ").trim().slice(0, 500);
            const path = "assets/portal8-updates.json";
            let current = [], sha;
            try {
              const response = await github.rest.repos.getContent({ owner, repo, path });
              if (Array.isArray(response.data)) throw new Error("Caminho de novidades inválido");
              sha = response.data.sha;
              current = JSON.parse(Buffer.from(response.data.content, "base64").toString("utf8"));
              if (!Array.isArray(current)) current = [];
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const item = {
              id: "versao-" + context.sha.slice(0, 12),
              title: title || "Novidade importante no Portal 8º Ano",
              body: description || "Uma atualização importante do portal já está disponível para todos os alunos.",
              date: (context.payload.head_commit?.timestamp || new Date().toISOString()).slice(0, 10),
              important: true
            };
            const next = [item, ...current.filter(x => x && x.id !== item.id)].slice(0, 15);
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, sha,
              message: "docs: publicar atualização importante no mural [skip ci]",
              content: Buffer.from(JSON.stringify(next, null, 2) + "\n").toString("base64")
            });
